spring:
  application:
    name: annsetu-core

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/annsetu}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      leak-detection-threshold: 60000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        use_sql_comments: false
        jdbc:
          lob:
            non_contextual_creation: true
        default_batch_fetch_size: 20
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    out-of-order: false

  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 2
        shutdown-timeout: 100ms

  security:
    oauth2:
      client:
        registration:
          agristack:
            client-id: ${AGRISTACK_CLIENT_ID:annsetu-client}
            client-secret: ${AGRISTACK_CLIENT_SECRET:secret}
            authorization-grant-type: client_credentials
            scope: farmer:read
        provider:
          agristack:
            token-uri: ${AGRISTACK_TOKEN_URI:https://api.agristack.gov.in/oauth/token}

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api/v1
  error:
    include-message: always
    include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    redis:
      enabled: true
    db:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

jwt:
  secret: ${JWT_SECRET:your-super-secret-jwt-key-change-in-production-min-32-chars}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
  issuer: annsetu

mock:
  otp:
    enabled: ${MOCK_OTP_ENABLED:true}
    default-code: "123456"
    ttl-seconds: 300
  agristack:
    seed-count: ${AGRISTACK_SEED_COUNT:1000}
  pfms:
    enabled: ${PFMS_MOCK_ENABLED:true}

rate-limit:
  ip-per-minute: ${RATE_LIMIT_IP_PER_MIN:5}
  farmer-per-minute: ${RATE_LIMIT_FARMER_PER_MIN:20}

captcha:
  enabled: ${CAPTCHA_ENABLED:true}
  secret: ${CAPTCHA_SECRET:dev-captcha-secret-change-in-prod}

logging:
  level:
    com.annsetu: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/annsetu.log